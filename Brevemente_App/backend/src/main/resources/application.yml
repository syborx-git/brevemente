spring:
  application:
    name: brevemente-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/brevemente_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-brevemente-demo-2026-syborx-clinical-engineering-change-me}
    expiration-minutes: 60

server:
  port: 8080
  servlet:
    context-path: /api/v1

server {
    listen 80;
    server_name localhost;

    # Permitir uploads grandes para audios clínicos y documentos (hasta 100MB)
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Reverse Proxy hacia Backend Spring Boot (con prioridad ^~ para que regex no intercepte .css/.js de Swagger)
    location ^~ /api/v1 {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Headers estándar de proxy inverso
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para streaming en tiempo real SSE (Server-Sent Events) de LEVA / Ollama
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
    }

    # 2. Cache agresivo para artefactos compilados con hash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 3. Soporte SPA (Single Page Application) de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

<aside class="w-64 bg-clinical-dark text-white flex flex-col shrink-0 h-screen shadow-lg border-r border-slate-800 select-none">
  <!-- Brand Header -->
  <div class="p-5 border-b border-slate-800 flex items-center justify-center">
    <div class="flex items-center gap-2 font-sans select-none h-10">
      <svg viewBox="0 0 100 100" fill="none" class="h-6 w-6 shrink-0">
        <path d="M50 85C66.5685 85 80 71.5685 80 55C80 40.5 70 30 50 30C30 30 20 40.5 20 55C20 71.5685 33.4315 85 50 85Z" fill="#75AFBC" fill-opacity="0.2"></path>
        <path d="M50 20C33.4315 20 20 33.4315 20 50C20 62 28 72 38 77" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>
        <path d="M50 20C66.5685 20 80 33.4315 80 50C80 62 72 72 62 77" stroke="#75AFBC" stroke-width="6" stroke-linecap="round"></path>
        <circle cx="50" cy="50" r="6" fill="#FFFFFF"></circle>
      </svg>
      <div class="leading-none">
        <span class="font-extrabold text-sm tracking-wide block">
          Breve<span class="text-clinical-accent">Mente</span>
        </span>
        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block mt-1">
          Administración
        </span>
      </div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <div class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
    <div *ngFor="let section of sections" class="space-y-2">
      <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest block px-3">
        {{ section.title }}
      </span>
      <nav class="space-y-1">
        <ng-container *ngFor="let item of section.items">
          <ng-container *ngIf="item.soon; else navLink">
            <div class="flex items-start gap-3 px-3 py-2.5 rounded-lg font-semibold text-xs leading-normal text-slate-600 cursor-not-allowed">
              <lucide-icon [img]="item.icon" class="w-4 h-4 shrink-0 mt-0.5" strokeWidth="2"></lucide-icon>
              <div class="flex flex-col flex-1 min-w-0">
                <span class="font-bold truncate">{{ item.label }}</span>
                <span class="text-[8px] text-slate-600 font-medium block mt-0.5">Pronto</span>
              </div>
            </div>
          </ng-container>
          <ng-template #navLink>
            <a
              [routerLink]="item.path"
              routerLinkActive="active-nav-item"
              [routerLinkActiveOptions]="{ exact: false }"
              class="nav-link flex items-start gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 group font-semibold text-xs leading-normal text-slate-400 hover:text-white hover:bg-slate-800">
              <lucide-icon [img]="item.icon" class="w-4 h-4 shrink-0 mt-0.5" strokeWidth="2"></lucide-icon>
              <span class="font-bold truncate">{{ item.label }}</span>
            </a>
          </ng-template>
        </ng-container>
      </nav>
    </div>
  </div>

  <!-- User Active Info Footer -->
  <div class="p-4 border-t border-slate-800 shrink-0 space-y-3">
    <div class="flex items-center gap-3 px-2">
      <div class="w-8 h-8 rounded-full bg-indigo-500/20 border border-indigo-400/40 flex items-center justify-center text-xs font-bold text-indigo-300 shrink-0">
        {{ getUserInitials() }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-white truncate">{{ roleService.currentUserName || 'Administrador' }}</p>
        <p class="text-[10px] text-slate-400 truncate">Administrador Plataforma</p>
      </div>
    </div>
    <button
      type="button"
      (click)="logout()"
      class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
      <lucide-icon [img]="logOutIcon" class="w-4 h-4 shrink-0" strokeWidth="2"></lucide-icon>
      Cerrar sesión
    </button>
  </div>
</aside>
